name: Automated Utility Bill Status Sync

on:
  schedule:
    - cron: '0 0 * * *' # প্রতিদিন বাংলাদেশ সময় সকাল ৬টায় স্বয়ংক্রিয়ভাবে রান করবে
  workflow_dispatch: # গিটহাব ড্যাশবোর্ড থেকে ম্যানুয়ালি রান (Test Run) করার জন্য

jobs:
  sync-billing-accounts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Execute Live API Connection and Verification
        env:
          MERCHANT_AUTH_TOKEN: ${{ secrets.MERCHANT_AUTH_TOKEN }}
          SMS_API_TOKEN: ${{ secrets.SMS_API_TOKEN }}
        run: python sync_script.py
        
